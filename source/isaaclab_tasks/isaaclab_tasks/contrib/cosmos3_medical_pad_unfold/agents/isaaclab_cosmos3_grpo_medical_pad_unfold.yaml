# H2 medical-pad unfolding with GR00T 1.7, Cosmos3 and GRPO.
# Keep complete GRPO groups on each actor rank.
env:
  group_name: EnvGroup
  train:
    env_type: isaaclab
    total_num_envs: 4
    group_size: 2
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    seed: 42
    rollout_epoch: 1
    use_fixed_reset_state_ids: false
    enable_offload: false
    reward_coef: 1.0
    use_rel_reward: false
    init_params:
      id: Isaac-H2-MedicalPad-Unfold-Cosmos3-Direct-v0
      task_description: unfold the medical nursing pad
    video_cfg:
      save_video: false
      fps: 30
      video_base_dir: ${runner.logger.log_path}/videos
    isaaclab:
      env_wrapper: isaaclab_contrib.rl.rlinf.neural_env:NeuralRlinfEnv
      env_factory: isaaclab_tasks.contrib.cosmos3_medical_pad_unfold.rlinf_env:create_env
      obs_converter_type: isaaclab_cosmos3_h2
      embodiment_tag: new_embodiment
      reset_manifest: null  # Bundled training/validation resets; extend for task evaluation.
      split: train
      codec_resources: null  # Bundled FK-only URDF and matching normalization statistics.
      world_model:
        checkpoint_path: .pretrained_checkpoints/medical_pad_unfold/world_model
        output_dir: ${runner.logger.log_path}/cosmos3
        mode: window
        image_size:
        - 480
        - 640
        chunk_size: 16
        fps: 30
        num_inference_steps: 30
      reward:
        checkpoint: .pretrained_checkpoints/medical_pad_unfold/classifier/reward_model.pt
        config_file: null  # Bundled classifier architecture/preprocessing config.
        success_class: 4  # v5: rewards [-2, -1, 0, 1, 2], success is the fifth class.
        failure_class: 0
        terminal_streak_frames: 30
        timeout_success_if_final_success: true
      gr00t_mapping: &id001
        video:
          main_images: video.high
        state:
        - gr00t_key: state.left_arm
          slice:
          - 0
          - 7
        - gr00t_key: state.right_arm
          slice:
          - 7
          - 14
        - gr00t_key: state.left_hand
          slice:
          - 14
          - 36
        - gr00t_key: state.right_hand
          slice:
          - 36
          - 58
        language: annotation.human.task_description
      action_mapping:
        keys:
        - left_arm
        - right_arm
        - left_hand
        - right_hand
  eval:
    env_type: isaaclab
    total_num_envs: 1
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    seed: 1042
    rollout_epoch: 1
    use_fixed_reset_state_ids: false
    enable_offload: false
    reward_coef: 1.0
    use_rel_reward: false
    init_params:
      id: Isaac-H2-MedicalPad-Unfold-Cosmos3-Direct-v0
      task_description: unfold the medical nursing pad
    video_cfg:
      save_video: false
      fps: 30
      video_base_dir: ${runner.logger.log_path}/videos
    isaaclab:
      env_wrapper: isaaclab_contrib.rl.rlinf.neural_env:NeuralRlinfEnv
      env_factory: isaaclab_tasks.contrib.cosmos3_medical_pad_unfold.rlinf_env:create_env
      obs_converter_type: isaaclab_cosmos3_h2
      embodiment_tag: new_embodiment
      reset_manifest: null
      split: validation
      codec_resources: null
      world_model:
        checkpoint_path: .pretrained_checkpoints/medical_pad_unfold/world_model
        output_dir: ${runner.logger.log_path}/cosmos3
        mode: window
        image_size:
        - 480
        - 640
        chunk_size: 16
        fps: 30
        num_inference_steps: 30
      reward:
        checkpoint: .pretrained_checkpoints/medical_pad_unfold/classifier/reward_model.pt
        config_file: null
        success_class: 4
        failure_class: 0
        terminal_streak_frames: 30
        timeout_success_if_final_success: true
      gr00t_mapping: *id001
      action_mapping:
        keys:
        - left_arm
        - right_arm
        - left_hand
        - right_hand
    is_eval: true
actor:
  model:
    model_type: gr00t_n1d7
    precision: bf16
    trust_remote_code: true
    is_lora: false
    action_dim: 58
    num_action_chunks: 16
    denoising_steps: 4
    obs_converter_type: isaaclab_cosmos3_h2
    embodiment_tag: new_embodiment
    add_value_head: false
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params:
      - 0.7
      - 0.3
      - 400
      noise_level: 0.3
      action_noise_scale: 0.0
      add_value_head: false
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 570
    num_steps: 4
    model_path: .pretrained_checkpoints/medical_pad_unfold/policy
    backbone_model_path: .pretrained_checkpoints/medical_pad_unfold/backbone
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
    sync_module_states: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 120
  seed: 1234
  enable_offload: false
  optim:
    lr: 1.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0
    clip_grad: 1.0
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  model: ${actor.model}
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 2
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
  filter_rewards: false
  log_group_success_metrics: true
  update_epoch: 1
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
runner:
  task_type: embodied
  logger:
    log_path: logs/rlinf
    project_name: isaaclab-cosmos3
    experiment_name: cosmos3-medpad-grpo
    logger_backends:
    - tensorboard
  max_epochs: 100
  max_steps: -1
  only_eval: false
  per_worker_log: true
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  eval_at_start: true
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    rollout: '2'
    env: '3'
reward:
  use_reward_model: false
critic:
  use_critic_model: false
