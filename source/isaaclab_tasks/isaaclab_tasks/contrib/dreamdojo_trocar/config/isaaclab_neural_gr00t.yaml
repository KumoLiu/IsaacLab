# Small integration run, not the retained large-batch DreamDojo training recipe.
# Keep task IDs and backend literal: the RLinf extension reads this source YAML.
defaults:
  - model/gr00t_n1d7@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  searchpath:
    - file://${oc.env:RLINF_ROOT}/examples/embodiment/config
  run:
    dir: .
  output_subdir: null

paths:
  workspace: ${oc.env:NEURAL_WORKSPACE}

cluster:
  num_nodes: 1
  component_placement:
    actor: "0"
    rollout: "1"
    env: "2"

runner:
  task_type: embodied
  logger:
    log_path: ${paths.workspace}/RLinf/logs/isaaclab_neural
    project_name: rlinf
    experiment_name: isaaclab_neural_gr00t
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: false
  per_worker_log: true
  val_check_interval: 1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 2
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
  filter_rewards: false

env:
  group_name: EnvGroup
  train: &native_env
    env_type: isaaclab
    isaaclab:
      backend: neural
      adapter: isaaclab_tasks.contrib.dreamdojo_trocar.rlinf_adapter:TrocarRLinfEnv
    init_params:
      id: Isaac-DreamDojo-Trocar-Direct-v0
    seed: 1234
    rollout_epoch: 1
    total_num_envs: 2
    group_size: ${algorithm.group_size}
    auto_reset: false
    # RLinf needs the mask generated by this flag for GRPO advantages.
    # The native task itself runs to its time limit, without success termination.
    ignore_terminations: false
    is_eval: false
    enable_offload: false
    use_fixed_reset_state_ids: false
    reset_episode_ids: [0, 1]
    max_episode_steps: 120
    max_steps_per_rollout_epoch: 120
    reward_coef: ${algorithm.reward_coef}
    # SubProcIsaacLabEnv inherits the launcher's Python and environment.
    worker_timeout_s: 600
    native_log_dir: ${runner.logger.log_path}/native/train
    inference: &native_inference
      dreamdojo_root: ${oc.env:DREAMDOJO_ROOT,${paths.workspace}/DreamDojo}
      dataset: ${oc.env:NEURAL_TRAIN_DATASET,${paths.workspace}/data/pick_trocar_teleop_success_train}
      wm_checkpoint: ${oc.env:DREAMDOJO_WM_CHECKPOINT,${paths.workspace}/models/dreamdojo/lora_r32_scratch_lr3e-4_18k/checkpoints/iter_000018000/model_ema_bf16.pt}
      reward_checkpoint: ${oc.env:DREAMDOJO_REWARD_CHECKPOINT,${paths.workspace}/DreamDojo/outputs/milestone/v2/best.pt}
      lam_checkpoint: ${oc.env:DREAMDOJO_LAM_CHECKPOINT}
      max_chunks: 10
      num_inference_steps: 15
    video_cfg:
      save_video: true
      fps: 15
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
  eval:
    <<: *native_env
    is_eval: true
    ignore_terminations: true
    total_num_envs: 1
    group_size: 1
    use_fixed_reset_state_ids: true
    reset_episode_ids: [0]
    native_log_dir: ${runner.logger.log_path}/native/eval
    inference:
      <<: *native_inference
      dataset: ${oc.env:NEURAL_EVAL_DATASET,${paths.workspace}/data/pick_trocar_teleop_success_validation}
    video_cfg:
      save_video: true
      fps: 15
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model: ${actor.model}
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 4
  seed: 1234
  enable_offload: false
  model:
    model_type: gr00t_n1d7
    model_path: ${oc.env:GR00T_MODEL_PATH,${paths.workspace}/models/s2r_models_dev/yunl/sft/g1/pick_trocar/g1_pick_trocar_head_10k_bs32_lr1e-4}
    embodiment_tag: new_embodiment
    obs_converter_type: g1_dex3_wm
    action_dim: 28
    num_action_chunks: 12
    denoising_steps: 4
    add_value_head: false
    rl_head_config:
      noise_level: 0.3
      action_noise_scale: 0.0
      # Decoded absolute joint targets, not normalized actions in [-1, 1].
      action_noise_clip: null
      noise_anneal: false
  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    sync_module_states: false
    gradient_checkpointing: true
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
